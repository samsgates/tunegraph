[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tunegraph"
version = "0.1.0"
description = "Enterprise control plane for traceable, composable, and reversible PEFT model behavior"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
authors = [{name = "TuneGraph Contributors"}]
keywords = ["llm", "lora", "peft", "mlops", "fine-tuning", "model-governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "aiosqlite>=0.22,<1",
  "alembic>=1.18,<2",
  "argon2-cffi>=23.1,<26",
  "cryptography>=46,<47",
  "email-validator>=2.2,<3",
  "fastapi>=0.128,<0.140",
  "httpx>=0.28,<0.29",
  "jsonschema>=4.23,<5",
  "orjson>=3.10,<4",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.14,<3",
  "pyjwt[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.50,<2.1",
  "structlog>=25.1,<27",
  "typer>=0.26,<0.28",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
ml = [
  "accelerate>=1.2,<2",
  "bitsandbytes>=0.45,<1; platform_system == 'Linux'",
  "datasets>=3.2,<6",
  "peft>=0.16,<1",
  "safetensors>=0.5,<1",
  "torch>=2.6,<3",
  "transformers>=4.48,<6",
  "trl>=0.15,<1",
]
s3 = ["boto3>=1.35,<2"]
otel = [
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-exporter-otlp>=1.30,<2",
  "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
  "opentelemetry-sdk>=1.30,<2",
]
dev = [
  "coverage[toml]>=7.6,<8",
  "mypy>=1.15,<3",
  "pre-commit>=4.1,<5",
  "pytest>=9,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.15,<1",
]

[project.scripts]
tunegraph = "tunegraph.cli:app"
tunegraph-worker = "tunegraph.workers.runner:main"

[project.urls]
Homepage = "https://github.com/tunegraph-ai/tunegraph"
Documentation = "https://github.com/tunegraph-ai/tunegraph/tree/main/docs"
Repository = "https://github.com/tunegraph-ai/tunegraph"
Issues = "https://github.com/tunegraph-ai/tunegraph/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tunegraph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["tunegraph"]
branch = true

[tool.coverage.report]
fail_under = 25
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
exclude = ["alembic"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
