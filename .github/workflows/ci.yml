name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run mypy src/tunegraph/domain src/tunegraph/security src/tunegraph/services/contracts.py src/tunegraph/services/hashing.py src/tunegraph/schemas.py
      - run: uv run pytest --cov=tunegraph --cov-report=xml --cov-fail-under=25
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tunegraph
          POSTGRES_USER: tunegraph
          POSTGRES_PASSWORD: tunegraph
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tunegraph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TUNEGRAPH_ENVIRONMENT: test
      TUNEGRAPH_DATABASE_URL: postgresql+psycopg://tunegraph:tunegraph@localhost:5432/tunegraph
      TUNEGRAPH_SECRET_KEY: test-secret-key-with-more-than-thirty-two-characters
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --extra dev
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install
      - run: npm run build
